name: Publish to npm

# Publishes the package when a GitHub release is published.
# Uses npm trusted publishing (OIDC), no npm token is stored in the repository.

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest

      - name: Check that the tag matches the version in package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $VERSION in package.json"
            exit 1
          fi

      - run: npm publish
